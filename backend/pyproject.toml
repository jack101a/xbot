[project]
name = "xbot"
version = "0.1.0"
description = "XBot Backend Services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "ruamel.yaml>=0.18.6",
    "cryptography>=42.0.5",
    "openai>=1.14.1",
    "playwright>=1.42.0",
    "playwright-stealth>=0.1.7",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0"
]

[dependency-groups]
dev = [
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "types-redis>=4.6.0.20240311",
    "types-cryptography>=3.3.18.20240311"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["xbot*"]
exclude = ["migrations*"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = ["A003", "RUF012", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

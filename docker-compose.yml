version: '3.9'
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 48mb --maxmemory-policy
      allkeys-lru
    environment:
    - TZ=${TZ:-Asia/Kolkata}
    mem_limit: 64m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  backend:
    image: ghcr.io/jack101a/xbot-api:latest
    restart: unless-stopped
    ports:
    - 8200:8200
    init: true
    shm_size: 1gb
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ:-Asia/Kolkata}
    - REDIS_URL=redis://redis:6379/0
    - DATABASE_URL=sqlite+aiosqlite:////app/data/xbot.db
    - BASE_PROFILE_DIR=/app/data/profiles
    - CHATGPT_BRIDGE_STATE=/app/data/.chatgpt-bridge
    - CHATGPT_BRIDGE_HEADLESS=true
    env_file:
    - path: .env
      required: false
    volumes:
    - ${CONFIG_PATH}/xbot:/app/data
    depends_on:
    - redis
    mem_limit: 800m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 800M
    logging: *id001
  worker:
    image: ghcr.io/jack101a/xbot-worker:latest
    restart: unless-stopped
    command:
    - celery
    - -A
    - xbot.celery_app
    - worker
    - --beat
    - -Q
    - celery,publish
    - --max-tasks-per-child=10
    - --concurrency=1
    - --loglevel=info
    - -n
    - tasks@%h
    init: true
    shm_size: 1gb
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ:-Asia/Kolkata}
    - REDIS_URL=redis://redis:6379/0
    - DATABASE_URL=sqlite+aiosqlite:////app/data/xbot.db
    - BASE_PROFILE_DIR=/app/data/profiles
    - CHATGPT_BRIDGE_STATE=/app/data/.chatgpt-bridge
    - CHATGPT_BRIDGE_HEADLESS=true
    env_file:
    - path: .env
      required: false
    volumes:
    - ${CONFIG_PATH}/xbot:/app/data
    depends_on:
    - redis
    - backend
    mem_limit: 800m
    memswap_limit: 1200m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 800M
    logging: *id001
  browser-worker:
    image: ghcr.io/jack101a/xbot-worker:latest
    restart: unless-stopped
    command:
    - celery
    - -A
    - xbot.celery_app
    - worker
    - -Q
    - browser
    - --max-tasks-per-child=10
    - --concurrency=1
    - --loglevel=info
    - -n
    - browser@%h
    init: true
    shm_size: 1gb
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ:-Asia/Kolkata}
    - REDIS_URL=redis://redis:6379/0
    - DATABASE_URL=sqlite+aiosqlite:////app/data/xbot.db
    - BASE_PROFILE_DIR=/app/data/profiles
    - CHATGPT_BRIDGE_STATE=/app/data/.chatgpt-bridge
    - CHATGPT_BRIDGE_HEADLESS=true
    env_file:
    - path: .env
      required: false
    volumes:
    - ${CONFIG_PATH}/xbot:/app/data
    depends_on:
    - redis
    - backend
    mem_limit: 1000m
    memswap_limit: 1500m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1000M
    logging: *id001
  sentinel:
    image: ghcr.io/jack101a/xbot-worker:latest
    restart: unless-stopped
    command:
    - python
    - -m
    - xbot.supervisor.sentinel
    init: true
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ:-Asia/Kolkata}
    - REDIS_URL=redis://redis:6379/0
    - DATABASE_URL=sqlite+aiosqlite:////app/data/xbot.db
    - BASE_PROFILE_DIR=/app/data/profiles
    env_file:
    - path: .env
      required: false
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:rw
    - ${CONFIG_PATH}/xbot:/app/data
    depends_on:
    - redis
    - backend
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging: *id001
  dashboard:
    image: ghcr.io/jack101a/xbot-dashboard:latest
    restart: unless-stopped
    ports:
    - 3002:3002
    environment:
    - TZ=${TZ:-Asia/Kolkata}
    depends_on:
    - backend
    mem_limit: 64m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    logging: *id001

services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: mcqsolver-backend
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # Mount YOLO model so it's not baked into the image (update without rebuild)
      - ./backend/model:/app/model:ro
      # Mount dataset so questions can be updated without rebuild
      - ./backend/dataset:/app/dataset:ro
      # Persist logs to host
      - ./backend/logs:/app/logs
    env_file:
      # Optional — only needed when AI_FALLBACK_ENABLED = True in main.py
      # Contains GEMINI_API_KEYS and NVIDIA_API_KEY
      # Copy backend/.env.example → backend/.env and fill in keys to enable
      - path: ./backend/.env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

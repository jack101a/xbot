services:
  # ==========================================
  # MCQ SOLVER API
  # ==========================================
  mcqsolver:
    image: git.ajaxhs.home/ajax/mcqsolver:${MCQ_IMAGE_TAG:-latest}
    container_name: mcqsolver_api
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      # Set to true to enable Gemini/NVIDIA fallback (requires keys below)
      - AI_FALLBACK_ENABLED=${MCQ_AI_FALLBACK:-false}
      # AI fallback keys — only active when AI_FALLBACK_ENABLED=true
      - GEMINI_API_KEYS=${MCQ_GEMINI_API_KEYS:-}
      - NVIDIA_API_KEY=${MCQ_NVIDIA_API_KEY:-}
      - NVIDIA_MODEL=${MCQ_NVIDIA_MODEL:-google/gemma-4-31b-it}
    ports:
      - "8765:8765"
    volumes:
      - ${CONFIG_PATH}/mcqsolver/logs:/app/logs
      - ${CONFIG_PATH}/mcqsolver/model:/app/model:ro
      - ${CONFIG_PATH}/mcqsolver/dataset:/app/dataset:ro
    networks:
      ajax_network:
        ipv4_address: 172.60.0.63


networks:
  ajax_network:
    external: true
